name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      # task-1/tests and task-2/tests both declare a `tests` package
      # (__init__.py) and both import a `src` package, the same naming
      # collision documented in task-1/src/narrative.py's header comment
      # for `src` specifically. Run each task's suite as its own pytest
      # invocation, never combined, same fix FleetPulse's CI already
      # uses for the identical problem (see its ci.yml's per-task
      # `python -m pytest task-8/tests/...` steps).
      - name: Unit tests (Task 1)
        run: python -m pytest task-1/tests -v

      - name: Unit tests (Task 2)
        run: python -m pytest task-2/tests -v

      # The eval-gate itself: block the merge if this PR's flagger
      # scores below the committed baseline in task-1/eval/baseline_score.json.
      # This is the "Done when" from the roadmap, a PR that quietly makes
      # CareThread's care-flags less accurate is rejected automatically.
      - name: Eval gate
        run: python task-1/eval/run_eval.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build CareThread API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: task-1/Dockerfile
          push: false
          tags: carethread-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: task-1/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
